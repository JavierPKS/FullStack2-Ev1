<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Ingresar Portal - DogSitter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="fondo-login">
    <div class="boton-volver">
        <a href="index.html">&larr; Volver al Inicio</a>
    </div>

    <main class="contenedor-login">
        <div class="tarjeta-login">

            <div class="logo-c">
                <span class="icono"><img src="img/logo.png" alt="Logo DogSitter" width="50px"></span>
                <h2>DogSitter</h2>
            </div>

            <p class="textoP textoC">Inicia sesión o selecciona un rol para coordinar banquetes premium y
                administrar recursos operativos de alta cocina canina.</p>

            <h3 class="textoC espA">Bienvenido de Nuevo</h3>
            <p class="textoP textoC">Ingresa tus credenciales para acceder a tu panel de control.</p>

            <form action="index.html" method="GET" id="loginForm" class="formulario-login">
                <p>
                    <label for="email" class="etiqueta-pequena">CORREO ELECTRÓNICO</label><br>
                    <input type="text" id="email" name="email" placeholder=" tu@correo.com">
                    <span id="mensaje_email" class="mensaje_error"></span>
                </p>

                <p>
                    <label for="password" class="etiqueta-pequena">CONTRASEÑA</label><br>
                    <input type="password" id="password" name="password">
                    <span id="mensaje_password" class="mensaje_error"></span>
                </p>

                <p>
                    <button type="submit" class="boton-primario boton-ancho">Acceder al Portal &rarr;</button>
                </p>
            </form>
        </div>

    </main>
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
</body>

</html>
